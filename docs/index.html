<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Israel population by locality, 2023</title>
<meta name="description" content="Select an area of the map — by rectangle, lasso or polygon — and read off the population totals inside it. CBS 2023 locality data.">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <h1><span data-i18n="title">Israel population by locality</span> <span class="year">2023</span></h1>

    <div class="bar-right">
      <div class="tools" role="toolbar" aria-label="Selection tools" data-i18n-aria="toolsLabel">
        <button type="button" class="tool" data-tool="rect" aria-pressed="false" data-i18n-title="rectTitle">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="4" width="11" height="8" rx="1"/></svg>
          <span data-i18n="rect">Rectangle</span>
        </button>
        <button type="button" class="tool" data-tool="lasso" aria-pressed="false" data-i18n-title="lassoTitle">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3c3 0 5.5 1.6 5.5 3.6S11 10.2 8 10.2 2.5 8.6 2.5 6.6 5 3 8 3Z"/><path d="M5 9.6c-.6 1.2-.4 2.6.6 3.4"/></svg>
          <span data-i18n="lasso">Lasso</span>
        </button>
        <button type="button" class="tool" data-tool="poly" aria-pressed="false" data-i18n-title="polyTitle">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5 13.5 7l-2 6.5h-7L2.5 7Z"/></svg>
          <span data-i18n="poly">Polygon</span>
        </button>
        <button type="button" class="tool ghost" id="clear" data-i18n-title="clearTitle"><span data-i18n="clear">Clear</span></button>
        <button type="button" class="tool" id="permalink" data-i18n-title="permalinkTitle">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.8 9.2a2.6 2.6 0 0 0 3.7 0l2-2a2.6 2.6 0 0 0-3.7-3.7l-.8.8"/><path d="M9.2 6.8a2.6 2.6 0 0 0-3.7 0l-2 2a2.6 2.6 0 0 0 3.7 3.7l.8-.8"/></svg>
          <span data-i18n="permalink" id="permalink-label">Copy link</span>
        </button>
      </div>

      <div class="lang" role="group" aria-label="Language / שפה">
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="he" lang="he">עברית</button>
      </div>
    </div>
  </header>

  <main id="map" data-i18n-aria="mapLabel" aria-label="Map of localities"></main>

  <aside id="panel">

    <div id="legend">
      <div class="legend-row" id="legend-colors"></div>
      <div class="legend-row sizes">
        <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span>
        <span class="legend-text" data-i18n="legendSizes">10k &middot; 100k &middot; 1M people</span>
      </div>
    </div>

    <div class="scope">
      <span id="scope-label">&nbsp;</span>
      <button type="button" id="zoom-sel" class="linkish" hidden data-i18n="zoomToSelection">zoom to selection</button>
    </div>

    <p class="edit-hint" id="edit-hint" hidden></p>

    <div class="hero" aria-live="polite">
      <div class="hero-value" id="total-value">—</div>
      <div class="hero-label" id="hero-label">&nbsp;</div>
      <div class="hero-share" id="total-share"></div>
    </div>

    <h2 data-i18n="composition">Composition</h2>
    <div class="stack" id="stack" role="img" aria-labelledby="stack-desc"></div>
    <p class="visually-hidden" id="stack-desc"></p>

    <table class="breakdown">
      <thead>
        <tr>
          <th scope="col" data-i18n="colGroup">Group</th>
          <th scope="col" data-i18n="colPeople">People</th>
          <th scope="col" data-i18n="colShare">Share</th>
        </tr>
      </thead>
      <tbody id="breakdown"></tbody>
    </table>

    <h2><span data-i18n="localities">Localities</span> <span class="count" id="list-count"></span></h2>
    <div class="list-wrap">
      <table class="list">
        <colgroup>
          <col class="name-col"><col class="total-col"><col class="jews-col"><col class="arabs-col"><col class="foreign-col">
        </colgroup>
        <thead>
          <tr>
            <th scope="col" data-i18n="colName">Name</th>
            <th scope="col" class="num" data-i18n="colTotal">Total</th>
            <th scope="col" class="num" data-i18n="colJews">Jews &amp; others</th>
            <th scope="col" class="num" data-i18n="colArabs">Arabs</th>
            <th scope="col" class="num" data-i18n="colForeign">Foreign</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>

    <p class="list-note" id="list-note" hidden></p>

    <div class="panel-foot">
      <button type="button" id="csv" class="tool ghost" data-i18n="downloadCsv">Download CSV</button>
      <p class="source" id="source-note"></p>
    </div>
  </aside>
</div>

<div id="hint" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="data.js"></script>
<script src="strings.js"></script>
<script src="app.js"></script>
</body>
</html>
